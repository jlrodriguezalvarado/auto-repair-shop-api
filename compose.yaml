name: auto-repair-shop-api

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common-api-env: &common-api-env
  DJANGO_SETTINGS_MODULE: config.settings
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-taller}
  POSTGRES_USER: ${POSTGRES_USER:-taller}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taller}
  DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-60}
  GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  WAIT_FOR_DB: "true"
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
  RUN_COLLECTSTATIC: ${RUN_COLLECTSTATIC:-true}

services:
  db:
    image: postgres:16-alpine
    restart: "no"
    init: true
    stop_grace_period: 30s
    stop_signal: SIGTERM
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taller}
      POSTGRES_USER: ${POSTGRES_USER:-taller}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taller}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging
    shm_size: 128mb

  redis:
    image: redis:7-alpine
    restart: "no"
    init: true
    stop_grace_period: 15s
    stop_signal: SIGTERM
    command: >
      redis-server
      --save ""
      --appendonly no
      --timeout 0
      --tcp-keepalive 60
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    networks:
      - backend
    ports:
      - "127.0.0.1:${REDIS_PUBLISHED_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging
    profiles:
      - redis

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    init: true
    stop_grace_period: 45s
    stop_signal: SIGTERM
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-api-env
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/schema/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  pgadmin:
    image: dpage/pgadmin4:8.14
    restart: "no"
    init: true
    stop_grace_period: 60s
    stop_signal: SIGTERM
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    networks:
      - backend
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/misc/ping || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging: *default-logging
    profiles:
      - tools

networks:
  backend:
    name: ${COMPOSE_PROJECT_NAME:-auto-repair-shop-api}_backend
    driver: bridge

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-auto-repair-shop-api}_postgres_data
  media_data:
    name: ${COMPOSE_PROJECT_NAME:-auto-repair-shop-api}_media_data
  static_data:
    name: ${COMPOSE_PROJECT_NAME:-auto-repair-shop-api}_static_data
  pgadmin_data:
    name: ${COMPOSE_PROJECT_NAME:-auto-repair-shop-api}_pgadmin_data
