      operationId: catalog_services_list
      description: Soft-delete destroy, POST restore, POST hard-delete, and list filter
        ?deleted=false|true|all.
      parameters:
      - in: query
        name: deleted
        schema:
          type: string
          enum:
          - all
          - 'false'
          - 'true'
        description: Filter soft-deleted rows. Default false (active only).
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - catalog
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceCatalogList'
          description: ''
    post:
