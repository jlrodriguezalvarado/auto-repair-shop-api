components:
  parameters:
    CompanyContextHeader:
      name: X-Company-Id
      in: header
      required: false
      schema:
        type: integer
      description: SUPER_ADMIN read-only company context. Required for SUPER_ADMIN
        on tenant business GET endpoints.
  schemas:
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - current_password
      - new_password
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        tax_id:
          type: string
          maxLength: 50
        address:
          type: string
        phone:
          type: string
          maxLength: 50
        secondary_phone:
          type: string
          nullable: true
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        logo:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - address
      - created_at
      - deleted_at
      - email
      - id
      - name
      - phone
      - tax_id
      - updated_at
    CompanyAdminUser:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 6
        first_name:
          type: string
          default: ''
        last_name:
          type: string
          default: ''
      required:
      - email
      - password
      - username
    CompanyBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name
    CompanyCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        tax_id:
          type: string
          maxLength: 50
        address:
          type: string
        phone:
          type: string
          maxLength: 50
        secondary_phone:
          type: string
          nullable: true
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        logo:
          type: string
          format: uri
          nullable: true
        admin_user:
          allOf:
          - $ref: '#/components/schemas/CompanyAdminUser'
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - address
      - admin_user
      - created_at
      - deleted_at
      - email
      - id
      - name
      - phone
      - tax_id
      - updated_at
