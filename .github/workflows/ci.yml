name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mechanics_api
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-secret-key-not-for-production
      JWT_SIGNING_KEY: ci-jwt-signing-key-not-for-production
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mechanics_api
      DEBUG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt
      - name: Ruff
        run: ruff check apps config
      - name: Django system check
        run: python manage.py check
      - name: Migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Pytest with coverage
        run: pytest --cov=apps --cov-report=term-missing -q
